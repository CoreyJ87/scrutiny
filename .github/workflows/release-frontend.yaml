# compiles React frontend and attaches it to the latest release.
name: Release Frontend

on:
  release:
    # Only use the types keyword to narrow down the activity types that will trigger your workflow.
    types: [published]

permissions:
  contents: write

jobs:
  release-frontend:
    name: Release Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: webapp/frontend-react/pnpm-lock.yaml

      - name: Generate frontend version information
        run: cd webapp/frontend-react && ./git.version.sh

      - name: Build Frontend
        run: |
          cd webapp/frontend-react
          pnpm install --frozen-lockfile
          pnpm run build
          tar -czf scrutiny-web-frontend.tar.gz -C dist .

      - name: Move tarball to workspace root
        run: mv webapp/frontend-react/scrutiny-web-frontend.tar.gz .

      - name: Install GitHub CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh

      - name: Update checksums with frontend
        env:
          GITHUB_TOKEN: ${{ secrets.SCRUTINY_GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          # Download existing checksums file
          gh release download "$VERSION" --pattern "SHA256SUMS.txt" --repo ${{ github.repository }} || true
          # Generate checksum for frontend tarball and append
          sha256sum scrutiny-web-frontend.tar.gz >> SHA256SUMS.txt
          # Sort for consistency and re-upload
          sort SHA256SUMS.txt -o SHA256SUMS.txt
          echo "Updated checksums:"
          cat SHA256SUMS.txt
          gh release upload "$VERSION" SHA256SUMS.txt --repo ${{ github.repository }} --clobber

      - name: Upload Frontend Asset
        uses: softprops/action-gh-release@v2
        with:
          files: scrutiny-web-frontend.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.SCRUTINY_GITHUB_TOKEN }}
